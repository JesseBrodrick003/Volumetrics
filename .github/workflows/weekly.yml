name: Weekly Volumetrics

on:
  schedule:
    - cron: "0 15 * * 2"   # Tuesday 15:00 UTC (8am PDT / 7am PST), after Monday Night Football
    - cron: "0 15 * * 3"   # Wednesday fallback: fills in any team whose snap counts were late
  workflow_dispatch:       # "Run workflow": builds if needed, re-publishes, and re-sends the link
    inputs:
      season: { description: "Season (blank = current)", required: false }
      week:   { description: "Week (blank = latest completed)", required: false }
      email:  { description: "Send the email", type: boolean, default: true }

permissions:
  contents: write   # commit the report into docs/
  pages: write      # publish docs/ to GitHub Pages
  id-token: write   # required by deploy-pages
  issues: write     # fallback notification if iCloud email isn't set up

concurrency:
  group: volumetrics
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build report
        id: report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: Claude voice pass
          VOLUMETRICS_BRAND: ${{ vars.VOLUMETRICS_BRAND }}      # optional: your handle on every chart
        run: |
          ARGS="--skip-if-exists"
          if [ -n "${{ inputs.season }}" ]; then ARGS="$ARGS --season ${{ inputs.season }}"; fi
          if [ -n "${{ inputs.week }}" ]; then ARGS="$ARGS --week ${{ inputs.week }}"; fi
          python run_weekly.py $ARGS

      - name: Commit report to docs/
        if: steps.report.outputs.built == 'true'
        run: |
          git config user.name  "volumetrics-bot"
          git config user.email "volumetrics-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Volumetrics ${{ steps.report.outputs.season }} week ${{ steps.report.outputs.week }}"
          git push

      - uses: actions/configure-pages@v5
        if: steps.report.outputs.built == 'true' || github.event_name == 'workflow_dispatch'

      - uses: actions/upload-pages-artifact@v3
        if: steps.report.outputs.built == 'true' || github.event_name == 'workflow_dispatch'
        with:
          path: docs

      - id: deployment
        if: steps.report.outputs.built == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4

      - name: Email the link
        if: (steps.report.outputs.built == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.email)
        env:
          GH_TOKEN: ${{ github.token }}
          SMTP_USER: ${{ vars.EMAIL_FROM }}                    # your iCloud address
          SMTP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}    # iCloud app-specific password
          EMAIL_TO: ${{ secrets.EMAIL_TO }}                    # friends, comma separated
        run: |
          URL="${{ steps.deployment.outputs.page_url }}${{ steps.report.outputs.path }}"
          WEEK="${{ steps.report.outputs.week }}"
          NOTE=""
          if [ "${{ steps.report.outputs.complete }}" != "true" ]; then
            NOTE="Still waiting on snap counts for: ${{ steps.report.outputs.missing }}. The Wednesday run adds them."
          fi
          if [ -n "$SMTP_PASSWORD" ] && [ -n "$SMTP_USER" ]; then
            # Real email from your iCloud: you + everyone in EMAIL_TO (BCC)
            python send_email.py --season "${{ steps.report.outputs.season }}" --week "$WEEK" --url "$URL" --note "$NOTE"
          else
            # Fallback: an issue that @mentions you; GitHub emails it to your notification address
            BODY="@${GITHUB_REPOSITORY_OWNER} Week ${WEEK} Volumetrics is up: ${URL}"
            [ -n "$NOTE" ] && BODY="${BODY}"$'\n\n'"${NOTE}"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "📊 Week ${WEEK} Volumetrics is up" \
              --body "$BODY" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
